name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Testes do leitor de etiquetas
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Gerar APK assinado
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/signing/carrinho-certo.jks
          KEYSTORE_PASSWORD: carrinhocerto
          KEY_ALIAS: carrinho
          KEY_PASSWORD: carrinhocerto
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CarrinhoCerto-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarrinhoCerto-apk
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Carrinho Certo 1.0.${{ github.run_number }}
          body: |
            APK do Carrinho Certo. No celular, baixe o arquivo .apk abaixo e abra para instalar
            (o Android vai pedir para permitir instalar de fontes desconhecidas).
          files: out/*.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: CarrinhoCerto-apk
          path: out
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash ci/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas-emulador
          path: shots/
