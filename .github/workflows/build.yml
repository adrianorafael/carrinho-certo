name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Testes do leitor de etiquetas
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Gerar APK assinado
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/signing/carrinho-certo.jks
          KEYSTORE_PASSWORD: carrinhocerto
          KEY_ALIAS: carrinho
          KEY_PASSWORD: carrinhocerto
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CarrinhoCerto-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarrinhoCerto-apk
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Carrinho Certo 1.0.${{ github.run_number }}
          body: |
            APK do Carrinho Certo. No celular, baixe o arquivo .apk abaixo e abra para instalar
            (o Android vai pedir para permitir instalar de fontes desconhecidas).
          files: out/*.apk
