name: Teste ponta a ponta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Gerar APK
        env:
          VERSION_CODE: ${{ github.run_number }}0
          KEYSTORE_FILE: ${{ github.workspace }}/signing/carrinho-certo.jks
          KEYSTORE_PASSWORD: carrinhocerto
          KEY_ALIAS: carrinho
          KEY_PASSWORD: carrinhocerto
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/CarrinhoCerto.apk
      - name: Baixar a versão 1.0.15 (teste de atualização)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.15 -R ${{ github.repository }} -p '*.apk' -D old
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: python3 ci/e2e.py
      - name: Publicar capturas
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: e2e-${{ github.run_number }}
          name: Teste ponta a ponta ${{ github.run_number }}
          prerelease: true
          files: |
            e2e_out/*
